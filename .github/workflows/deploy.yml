name: Build & Deploy

on:
  workflow_dispatch:
  repository_dispatch:
    types: [contentful-update]
  push:
    branches: [main]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    concurrency: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Preparar .env desde secrets
        env:
          S1: ${{ secrets.CONTENTFUL_SPACE_ID }}
          S2: ${{ secrets.CONTENTFUL_ACCESS_TOKEN }}
          V1: ${{ vars.CONTENTFUL_SPACE_ID }}
          V2: ${{ vars.CONTENTFUL_ACCESS_TOKEN }}
        run: |
          SPACE_ID="${S1:-$V1}"
          ACCESS_TOKEN="${S2:-$V2}"
          echo "secret space_id: $([ -n "$S1" ] && echo PRESENT || echo EMPTY)"
          echo "secret access_token: $([ -n "$S2" ] && echo PRESENT || echo EMPTY)"
          echo "variable space_id: $([ -n "$V1" ] && echo PRESENT || echo EMPTY)"
          echo "variable access_token: $([ -n "$V2" ] && echo PRESENT || echo EMPTY)"
          if [ -z "$SPACE_ID" ] || [ -z "$ACCESS_TOKEN" ]; then
            echo "::error::Secret/var no encontrado. Ver: repo settings → Secrets and variables → Actions (tab Secrets)"; exit 1
          fi
          printf "CONTENTFUL_SPACE_ID=%s\nCONTENTFUL_ACCESS_TOKEN=%s\n" "$SPACE_ID" "$ACCESS_TOKEN" > .env

      - name: Build
        run: npm run build

      - name: Verificar secrets FTP y exportar a env
        env:
          S1: ${{ secrets.FTP_HOST }}
          S2: ${{ secrets.FTP_USERNAME }}
          S3: ${{ secrets.FTP_PASSWORD }}
          S4: ${{ secrets.FTP_SERVER_DIR }}
          V1: ${{ vars.FTP_HOST }}
          V2: ${{ vars.FTP_USERNAME }}
          V3: ${{ vars.FTP_PASSWORD }}
          V4: ${{ vars.FTP_SERVER_DIR }}
        run: |
          for i in 1 2 3 4; do
            eval "name=\$S$i"; eval "val=\$V$i"
            echo "FTP[$i] secret: $([ -n "$name" ] && echo PRESENT || echo EMPTY) | variable: $([ -n "$val" ] && echo PRESENT || echo EMPTY)"
          done
          FTP_HOST="${S1:-$V1}"
          FTP_USERNAME="${S2:-$V2}"
          FTP_PASSWORD="${S3:-$V3}"
          FTP_SERVER_DIR="${S4:-$V4}"
          FTP_SERVER_DIR="${FTP_SERVER_DIR%/}/"
          if [ -z "$FTP_HOST" ] || [ -z "$FTP_USERNAME" ] || [ -z "$FTP_PASSWORD" ] || [ -z "$FTP_SERVER_DIR" ]; then
            echo "::error::Faltan secrets/vars FTP (FTP_HOST, FTP_USERNAME, FTP_PASSWORD, FTP_SERVER_DIR). Ver: repo settings → Secrets and variables → Actions (tab Secrets)"; exit 1
          fi
          {
            echo "FTP_HOST=$FTP_HOST"
            echo "FTP_USERNAME=$FTP_USERNAME"
            echo "FTP_PASSWORD=$FTP_PASSWORD"
            echo "FTP_SERVER_DIR=$FTP_SERVER_DIR"
          } >> "$GITHUB_ENV"

      - name: Deploy to Hostinger (FTP)
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ env.FTP_HOST }}
          username: ${{ env.FTP_USERNAME }}
          password: ${{ env.FTP_PASSWORD }}
          server-dir: ${{ env.FTP_SERVER_DIR }}
          local-dir: ./dist/
          protocol: ftp
          port: 21
          # Importante: NO usar dangerous-clean-slate (borra todo el server-dir).
          # Con server-dir=/ y clean-slate activo se borró la web entera.
          dangerous-clean-slate: false
          timeout: 180000