name: Build & Deploy

on:
  repository_dispatch:
    types: [contentful-update]
  push:
    branches: [main]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    concurrency: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Preparar .env desde secrets
        env:
          SPACE_ID: ${{ secrets.CONTENTFUL_SPACE_ID }}
          ACCESS_TOKEN: ${{ secrets.CONTENTFUL_ACCESS_TOKEN }}
        run: |
          if [ -z "$SPACE_ID" ] || [ -z "$ACCESS_TOKEN" ]; then
            echo "::error::Falta cargar CONTENTFUL_SPACE_ID/CONTENTFUL_ACCESS_TOKEN en repo secrets"; exit 1
          fi
          printf "CONTENTFUL_SPACE_ID=%s\nCONTENTFUL_ACCESS_TOKEN=%s\n" "$SPACE_ID" "$ACCESS_TOKEN" > .env

      - name: Build
        run: npm run build

      - name: Deploy to Hostinger (FTP)
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ${{ secrets.FTP_SERVER_DIR }}
          local-dir: ./dist/
          protocol: ftp
          dangerous--clean-dest: true