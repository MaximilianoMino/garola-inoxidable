name: Build & Deploy

on:
  workflow_dispatch:
  repository_dispatch:
    types: [contentful-update]
  push:
    branches: [main]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    concurrency: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Preparar .env desde secrets
        env:
          S1: ${{ secrets.CONTENTFUL_SPACE_ID }}
          S2: ${{ secrets.CONTENTFUL_ACCESS_TOKEN }}
          V1: ${{ vars.CONTENTFUL_SPACE_ID }}
          V2: ${{ vars.CONTENTFUL_ACCESS_TOKEN }}
        run: |
          SPACE_ID="${S1:-$V1}"
          ACCESS_TOKEN="${S2:-$V2}"
          echo "secret space_id: $([ -n "$S1" ] && echo PRESENT || echo EMPTY)"
          echo "secret access_token: $([ -n "$S2" ] && echo PRESENT || echo EMPTY)"
          echo "variable space_id: $([ -n "$V1" ] && echo PRESENT || echo EMPTY)"
          echo "variable access_token: $([ -n "$V2" ] && echo PRESENT || echo EMPTY)"
          if [ -z "$SPACE_ID" ] || [ -z "$ACCESS_TOKEN" ]; then
            echo "::error::Secret/var no encontrado. Ver: repo settings → Secrets and variables → Actions (tab Secrets)"; exit 1
          fi
          printf "CONTENTFUL_SPACE_ID=%s\nCONTENTFUL_ACCESS_TOKEN=%s\n" "$SPACE_ID" "$ACCESS_TOKEN" > .env

      - name: Build
        run: npm run build

      - name: Verificar secrets FTP y exportar a env
        env:
          S1: ${{ secrets.FTP_HOST }}
          S2: ${{ secrets.FTP_USERNAME }}
          S3: ${{ secrets.FTP_PASSWORD }}
          S4: ${{ secrets.FTP_SERVER_DIR }}
          V1: ${{ vars.FTP_HOST }}
          V2: ${{ vars.FTP_USERNAME }}
          V3: ${{ vars.FTP_PASSWORD }}
          V4: ${{ vars.FTP_SERVER_DIR }}
        run: |
          for i in 1 2 3 4; do
            eval "name=\$S$i"; eval "val=\$V$i"
            echo "FTP[$i] secret: $([ -n "$name" ] && echo PRESENT || echo EMPTY) | variable: $([ -n "$val" ] && echo PRESENT || echo EMPTY)"
          done
          FTP_HOST="${S1:-$V1}"
          FTP_USERNAME="${S2:-$V2}"
          FTP_PASSWORD="${S3:-$V3}"
          # FTP_SERVER_DIR se controla via VARIABLE (no secret) para verificar el valor real.
          # El usuario FTP ya entra a la web root, por lo que el server-dir correcto es "/".
          FTP_SERVER_DIR="${V4:-${S4:-\"/\"}}"
          FTP_SERVER_DIR="${FTP_SERVER_DIR%/}/"
          echo "FTP_SERVER_DIR_RESOLVED=[${FTP_SERVER_DIR}]"
          if [ -z "$FTP_HOST" ] || [ -z "$FTP_USERNAME" ] || [ -z "$FTP_PASSWORD" ] || [ -z "$FTP_SERVER_DIR" ]; then
            echo "::error::Faltan secrets/vars FTP (FTP_HOST, FTP_USERNAME, FTP_PASSWORD, FTP_SERVER_DIR). Ver: repo settings → Secrets and variables → Actions (tab Secrets)"; exit 1
          fi
          {
            echo "FTP_HOST=$FTP_HOST"
            echo "FTP_USERNAME=$FTP_USERNAME"
            echo "FTP_PASSWORD=$FTP_PASSWORD"
            echo "FTP_SERVER_DIR=$FTP_SERVER_DIR"
          } >> "$GITHUB_ENV"

      - name: DIAG - Subir marcador y verificar donde escribe GitHub
        env:
          FTP_HOST: ${{ env.FTP_HOST }}
          FTP_USERNAME: ${{ env.FTP_USERNAME }}
          FTP_PASSWORD: ${{ env.FTP_PASSWORD }}
          FTP_SERVER_DIR: ${{ env.FTP_SERVER_DIR }}
        run: |
          if ! command -v lftp >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq lftp
          fi
          echo "GH-MARKER-$(date +%s)" > /tmp/gh-marker.txt
          echo "server-dir = [$FTP_SERVER_DIR]"
          lftp -u "$FTP_USERNAME,$FTP_PASSWORD" -p 21 "$FTP_HOST" \
            -e "set net:connect-timeout 30; set passive on; set ftp:ssl-allow no; put -O $FTP_SERVER_DIR /tmp/gh-marker.txt; quit"
          echo "subido. Verificando por HTTP..."
          for url in "https://www.garolainoxidable.com.ar/gh-marker.txt" "https://garolainoxidable.com.ar/gh-marker.txt"; do
            echo "HTTP $url => $(curl -s -o /dev/null -w '%{http_code}' $url)"
          done

      - name: Deploy to Hostinger (FTP con reintentos)
        env:
          FTP_HOST: ${{ env.FTP_HOST }}
          FTP_USERNAME: ${{ env.FTP_USERNAME }}
          FTP_PASSWORD: ${{ env.FTP_PASSWORD }}
          FTP_SERVER_DIR: ${{ env.FTP_SERVER_DIR }}
        run: |
          # lftp reconecta y reintenta solo. Hostinger bloquea IPs de GitHub a veces; reintentamos todo.
          if ! command -v lftp >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq lftp
          fi
          for attempt in 1 2 3 4 5; do
            echo "::group::Intento FTP $attempt/5"
            set +e
            lftp -u "$FTP_USERNAME,$FTP_PASSWORD" -p 21 "$FTP_HOST" \
              -e "set net:connect-timeout 60; set net:timeout 60; set net:max-retries 3; set net:reconnect-interval-base 5; set passive on; set ftp:ssl-allow no; mirror -R --no-perms --no-umask --verbose ./dist/ $FTP_SERVER_DIR; quit"
            rc=$?
            set -e
            echo "::endgroup::"
            if [ $rc -eq 0 ]; then
              echo "Deploy FTP OK en intento $attempt"
              exit 0
            fi
            echo "FTP fallo en intento $attempt (exit=$rc). Reintentando en 30s..."
            sleep 30
          done
          echo "::error::FTP fallo en los 5 intentos"
          exit 1